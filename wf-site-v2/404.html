<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page not found · Whole Founder</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<!-- Self-contained on purpose: a 404 can be served at any path, so it loads nothing relative. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#091532;color:#fff;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px;overflow:hidden;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(110px);pointer-events:none}
.a{width:620px;height:620px;background:linear-gradient(315deg,#7C8FE6,#668BDF,#5FC8DC,#54E6C6,#45FFC0);opacity:.18;top:-280px;right:-200px}
.b{width:440px;height:440px;background:linear-gradient(180deg,#45FFC0,#ABFFE3);opacity:.1;bottom:-240px;left:-160px}
main{position:relative;z-index:2;max-width:560px}
.k{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#45FFC0}
h1{font:800 clamp(34px,7vw,56px)/1 'Inter Tight',sans-serif;letter-spacing:-.03em;text-transform:uppercase;margin-top:16px}
p{color:#C2C9D8;font-size:18px;line-height:1.55;margin-top:18px}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:32px}
a{display:inline-flex;align-items:center;font-weight:600;font-size:15px;padding:15px 28px;border-radius:999px;text-decoration:none;line-height:1}
.p{background:#45FFC0;color:#091532}
.g{border:1px solid #243152;color:#fff}
</style>
</head>
<body>
<span class="blob a"></span><span class="blob b"></span>
<main>
  <span class="k">Whole Founder · 404</span>
  <h1>This page doesn't&nbsp;exist</h1>
  <p>The link may be old or mistyped. Start from the home page, or book a call and we'll talk through your&nbsp;growth.</p>
  <div class="row"><a class="p" href="/">Back to home</a><a class="g" href="/contact/">Book a call</a></div>
</main>
</body>
</html>
